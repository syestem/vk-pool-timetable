<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Расписание бассейна</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="hero">
    <div class="hero-copy">
      <div class="hero-badge">Мини-приложение</div>
      <h1 id="title">Расписание бассейна</h1>
      <p class="hero-text">
        Свободные дорожки на сегодня и всю неделю в удобном формате.
      </p>
    </div>

    <div class="hero-actions">
      <button id="themeToggle" class="btn icon-btn ghost" type="button" aria-label="Сменить тему">
        <span id="themeToggleIcon" class="theme-icon" aria-hidden="true"></span>
        <span id="themeToggleText">Темная тема</span>
      </button>
    </div>
  </header>

  <!-- ===== CONTROLS ===== -->
  <section class="controls card-shell">
    <div class="controls-header">
      <div>
        <div class="section-title">Фильтры</div>
        <div class="section-subtitle">Выберите бассейн, день и минимальное число свободных дорожек</div>
      </div>
    </div>

    <!-- row 1 -->
    <div class="controls-row">
      <div class="controls-group segmented" role="tablist" aria-label="Выбор бассейна">
        <button data-pool="big" class="btn primary">Большой бассейн</button>
        <button data-pool="small" class="btn">Малый бассейн</button>
      </div>

      <div class="controls-group right">
        <select id="laneFilter" class="select">
          <option value="0">Все</option>
          <option value="1">Любая свободная</option>
          <option value="2">От 2 дорожек</option>
          <option value="3">От 3 дорожек</option>
          <option value="4">От 4 дорожек</option>
          <option value="5">От 5 дорожек</option>
          <option value="6">От 6 дорожек</option>
        </select>

        <button id="showAllBtn" class="btn ghost">Показать всё</button>
      </div>
    </div>

    <!-- row 2 -->
    <div class="controls-row days" id="dayTabs"></div>

  </section>

  <!-- ===== CONTENT ===== -->
  <section class="schedule-panel">
    <div class="section-heading">
      <div>
        <div class="section-title">Слоты</div>
        <div class="section-subtitle">Подсвечиваем лучший вариант и текущее время на воде</div>
      </div>
    </div>
    <div id="scheduleContent" class="content"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
