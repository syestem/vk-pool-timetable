<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Расписание бассейна</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <div class="hero">
    <div class="hero-topbar">
      <div class="hero-brand">
        <div class="hero-brand__logo" aria-hidden="true">VK</div>
        <div>
          <div class="hero-brand__eyebrow">Мини-приложение</div>
          <div class="hero-brand__title">Свободные дорожки</div>
        </div>
      </div>

      <button id="themeToggle" class="icon-btn" type="button" aria-label="Переключить тему">
        <span id="themeIcon" aria-hidden="true">◐</span>
      </button>
    </div>

    <div class="hero-body">
      <div>
        <h1 id="title">Расписание бассейна</h1>
        <p class="hero-subtitle">Быстрый просмотр занятости дорожек с фильтрами, подсветкой лучшего слота и адаптацией под светлую и темную темы.</p>
      </div>
      <div class="hero-chip-row">
        <div class="hero-chip">VK style</div>
        <div class="hero-chip">Live schedule</div>
        <div class="hero-chip">Mobile first</div>
      </div>
    </div>
  </div>

  <!-- ===== CONTROLS ===== -->
  <div class="controls">

    <!-- row 1 -->
    <div class="controls-row">
      <div class="controls-group">
        <button data-pool="big" class="btn primary">Большой бассейн</button>
        <button data-pool="small" class="btn">Малый бассейн</button>
      </div>

      <div class="controls-group right">
        <select id="laneFilter" class="select">
          <option value="0">Все</option>
          <option value="1">Любая свободная</option>
          <option value="2">От 2 дорожек</option>
          <option value="3">От 3 дорожек</option>
          <option value="4">От 4 дорожек</option>
          <option value="5">От 5 дорожек</option>
          <option value="6">От 6 дорожек</option>
        </select>

        <button id="showAllBtn" class="btn ghost">Показать всё</button>
      </div>
    </div>

    <!-- row 2 -->
    <div class="controls-row days" id="dayTabs"></div>

  </div>

  <!-- ===== CONTENT ===== -->
  <div id="scheduleContent" class="content"></div>

</div>

<script src="app.js"></script>
</body>
</html>
